defaults:
  - hydra: default
  - model: dyn_unet_base
  - _self_

# i/o
image_path: /workspace_QMRI/USERS_CODE/hsalles/12_vesselFM/vesselFM/tests/MWA20220519a/RESAMPLED
image_file_ending: nii.gz
output_folder: /workspace_QMRI/USERS_CODE/hsalles/12_vesselFM/vesselFM/tests/MWA20220519a/VESSELS_OUR
file_app: ""

mask_path: null
round_to: 2

# model & ckpt
device: cuda:0
ckpt_path: runs/rmsbvessel/260717a/pretrain_260717a_last.ckpt

# sliding window inferer
batch_size: 16
patch_size: [128, 128, 128]
overlap: 0.5
mode: "constant"
sigma_scale: 0.125
padding_mode: "constant"

# eval & reproducibility
seed: 404

# standard pre-processing transforms
transforms_config:
  - EnsureChannelFirst:
      channel_dim: "no_channel"
  - ScaleIntensityRangePercentiles:
      lower: 1
      upper: 99
      b_min: 0
      b_max: 1
      clip: true
  - ToTensor:
      device: null

# test time augmentation
tta:
  scales: [0.2, 0.5, 1, 1.5]
  invert: true
  invert_mean_thresh: 0.1
  equalize_hist: false
  hist_bins: 100

# post-processing
post:
  apply: true
  small_objects_min_size: 500
  small_objects_connectivity: 3

# merging
merging:
  threshold: 0.5
  max: true