defaults:
  - hydra: default
  - model: dyn_unet_base
  - _self_

## T1 vibe config

# i/o
image_path: tests/MWA20220317a/04_FILTERED
image_file_ending: nii.gz
output_folder: tests/MWA20220317a/05_VESSELS
file_app: ""

mask_path: null
round_to: 2

# model & ckpt
device: cuda:0
ckpt_path: /path/to/ckpt.pt

# sliding window inferer
batch_size: 16
patch_size: [128, 128, 128]
overlap: 0.5
mode: "constant"
sigma_scale: 0.125
padding_mode: "constant"

# eval & reproducibility
seed: 404

# standard pre-processing transforms
transforms_config:
  - EnsureChannelFirst:
      channel_dim: "no_channel"
  - ScaleIntensityRangePercentiles:
      lower: 1
      upper: 99
      b_min: 0
      b_max: 1
      clip: true
  - ToTensor:
      device: null

# test time augmentation
tta:
  scales: [0.2, 0.5, 1]
  invert: true
  invert_mean_thresh: 0.1
  equalize_hist: false
  hist_bins: 100

# post-processing
post:
  apply: true
  small_objects_min_size: 1000
  small_objects_connectivity: 3

# merging
merging:
  threshold: 0.5
  max: true