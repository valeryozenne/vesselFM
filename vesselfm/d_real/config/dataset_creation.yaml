input_size: [128, 128, 128]
path: data/d_real #TODO
generate_datasets:
  [
    3Dircadb1,
    DeepVess,
    DeepVesselNet_syncrotone,
    DeepVesselNet_tof_mra,
    HiP-CT,
    HRKidney,
    Lightsheet_no_rot,
    MiniVess,
    TubeNet_2Photon,
    TubeNet_MRI,
    TubeTK,
    VesselExpress_Figure2,
    VesselExpress_Heart,
    VesselExpress_Bladder,
    VesSAP_anno_c0_no_rot,
    VesSAP_anno_c1_no_rot,
    CSD,
    TopCoW_ct,
    TopCoW_mra,
    # OCTA_no_rot,
    # SMILE,
    # BvEM,
    # MSD_Task8
  ]
cpus: 64
generate_nifti: false # pour les images de validation, mettre à true

dataset:
  3Dircadb1:
    num_samples: 10000
    path: data/converted_real/3Dircadb1 # TODO
  DeepVess:
    num_samples: 10000
    path: data/converted_real/DeepVess # TODO
  DeepVesselNet_syncrotone:
    num_samples: 1000
    path: /path/to/preprocessed/DeepVesselNet_syncrotone # TODO
  DeepVesselNet_tof_mra:
    num_samples: 1000
    path: /path/to/preprocessed/DeepVesselNet_tof_mra # TODO
  HiP-CT:
    num_samples: 5000
    path: /path/to/preprocessed/HiP-CT # TODO
